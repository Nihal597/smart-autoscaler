apiVersion: apps/v1
kind: Deployment
metadata:
  name: integration-svc-depl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: integration-svc-depl
  template:
    metadata:
      labels:
        app: integration-svc-depl
    spec:
      containers:
      - name: integration-svc-depl
        image: nihal597/intergration-svc:latest
        resources:
          requests:
            memory: "128Mi"
            cpu: "250m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        ports:
        - containerPort: 9110
---
apiVersion: v1
kind: Service
metadata:
  name: integration-svc
  labels:
    app: integration-svc
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9110"
    prometheus.io/path: "/actuator/prometheus"
spec:
  selector:
    app: integration-svc-depl
  ports:  
    - name: http
      protocol: TCP
      port: 9110
      targetPort: 9110
  type: LoadBalancer


