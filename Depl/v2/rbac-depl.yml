apiVersion: v1
kind: ServiceAccount
metadata:
  name: smartscaler-sa
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind:  ClusterRole
metadata:
  name: smartscaler-role
  namespace: default
rules:
  - apiGroups: ["apps"]
    resources: ["deployments","deployments/scale"]
    verbs: ["get","list","watch","update","patch"]
  - apiGroups: ["autoscale.monitoring.io"]
    resources: ["smartscalers","smartscalers/status"]
    verbs: ["get","list","watch","update","patch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get","create","patch","update","list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind:  ClusterRoleBinding
metadata:
  name: smartscaler-binding
  namespace: default
subjects:
  - kind: ServiceAccount
    name: smartscaler-sa
    namespace: default
roleRef:
  kind:  ClusterRole
  name: smartscaler-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smartscaler-controller
  labels:
   app: smartscaler-controller
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smartscaler-controller
  template:
    metadata:
      labels:
        app: smartscaler-controller
    spec:
      serviceAccountName: smartscaler-sa
      containers:
        - name: smartscaler
          image: nihal597/smartscaler:latest
          env:
            - name: PROMETHEUS_URL
              value: "http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090"
            - name: NAMESPACE
              value: "default"
            - name: POLL_INTERVAL
              value: "15"
