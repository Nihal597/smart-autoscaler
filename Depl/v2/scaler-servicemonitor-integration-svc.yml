apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: integration-svc-smart
  labels:
    release: kube-prometheus-stack   # must match your Prometheus release name
spec:
  selector:
    matchLabels:
      app: integration-svc-smart
  namespaceSelector:
    matchNames:
      - default
  endpoints:
  - port: http
    path: /actuator/prometheus
    interval: 15s